name: chungmo
description: "모바일 청첩장 모음 앱 청모"
publish_to: "none"
version: 1.3.1+7

environment:
  # fl_chart 1.2.0 needs Dart >=3.6.2; the declared floor must not admit
  # SDKs the dependencies can't resolve on.
  sdk: ^3.6.2

dependencies:
  add_2_calendar: ^3.1.1
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  firebase_ai: ^3.6.0
  firebase_analytics: ^12.5.0
  firebase_app_check: ^0.4.7
  firebase_core: ^4.2.1
  firebase_crashlytics: ^5.3.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  freezed_annotation: ^3.0.0
  get_it: ^8.0.3
  home_widget: ^0.9.4
  html: ^0.15.6
  http: ^1.6.0
  image: ^4.9.2
  image_picker: ^1.2.1
  injectable: ^2.6.0
  injectable_generator: ^2.7.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  lottie: ^3.3.0
  murmur3: ^2.1.0
  package_info_plus: ^8.3.0
  path: ^1.9.1
  permission_handler: ^11.4.0
  # Pinned below 1.9.0: 1.9.x drops CocoaPods (SPM-only), which breaks the
  # Share Extension pod integration in ios/Podfile.
  receive_sharing_intent: '>=1.8.1 <1.9.0'
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  table_calendar: ^3.1.3
  timezone: ^0.10.0
  tutorial_coach_mark: ^1.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^3.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  mockito: ^5.4.5
  change_app_package_name: ^1.5.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/analyze.lottie
    - assets/images/icon_trans_960.png
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

flutter_native_splash:
  android: true
  ios: true
  web: true
  color: "#F95E48"
  image: assets/images/icon_trans.png
  android_12:
    color: "#F95E48"
    image: assets/images/icon_trans_960.png
